name: PayrollBCAConverter
options:
  bundleIdPrefix: com.payrollbca
  deploymentTarget:
    iOS: "16.0"
packages:
  CoreXLSX:
    url: https://github.com
    from: 0.14.0
targets:
  PayrollBCAConverter:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.payrollbca.converter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        EXPANDED_CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Payroll BCA
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
